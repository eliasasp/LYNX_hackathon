[project]
name = "LynxHackathon"
version = "0.1.0"
description = "Project submission from <team_name> for the Lynx Hackathon 2026"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
    "numpy>=2.0.0",
    "pandas>=2.0.0",
    "polars>=1.44.1",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]
